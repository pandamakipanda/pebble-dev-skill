name: 🐛 Bug 报告
description: 工具报错、脚本跑不通、测试失败
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量把信息填全 —— 这类项目里"环境差异"是绝大多数问题的根因。
        **提交前请先搜一下已有 issue。**

  - type: dropdown
    id: component
    attributes:
      label: 出问题的部分
      options:
        - skill/pebble-dev/SKILL.md（文档内容）
        - skill/pebble-dev/starter（起始工程 / 构建 / 测试）
        - emulator-toolkit（模拟器与截图）
        - .github（CI / 模板）
        - 不确定
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 实际行为 + 你期望的行为
      placeholder: |
        我跑了 `make test`，期望……，实际……
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤（命令）
      description: 请贴可直接复制执行的命令。没有复现步骤的问题很难处理。
      render: shell
      placeholder: |
        git clone ...
        cd skill/pebble-dev/starter/my-watchface
        make test
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: 完整报错输出
      description: 请贴**完整**输出（不要只贴最后一行）。前后加 ``` 会更好读。
      render: shell
    validations:
      required: true

  - type: input
    id: arch
    attributes:
      label: 架构与操作系统
      description: "重要：arm64 与 x86_64 的坑完全不同（例如 stpyv8 只有 x86_64 轮子）"
      placeholder: "aarch64 Ubuntu 24.04 / x86_64 macOS 15 / WSL2 ..."
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: pebble-tool / SDK 版本
      description: 输出 `pebble --version` 和 `pebble sdk list`
      placeholder: "pebble-tool 5.0.40, SDK 4.33.1"
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已经搜过现有 issue，没有重复
          required: true
        - label: 我贴的输出里**没有** token、密钥或个人信息
          required: true
